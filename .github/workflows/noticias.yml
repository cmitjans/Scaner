# Cada 3 horas recolecta titulares de los medios, traduce al español los que están en otros idiomas
# (localmente, con Argos Translate) y actualiza el análisis en noticias/datos/.
name: Comparar titulares

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/noticias.yml
      # Modelos de traducción (≈500 MB): se guardan entre ejecuciones para no descargarlos cada vez
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-modelos-v1
      - name: Instalar
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install feedparser==6.0.11 argostranslate==1.11.0
      - run: python noticias/recolectar.py
      - run: python noticias/traducir.py
      - run: python noticias/analizar.py
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add noticias/datos
          git commit -m "Titulares actualizados" || echo "Sin cambios"
          git pull --rebase -q || true
          git push
