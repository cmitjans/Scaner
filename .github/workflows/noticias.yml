# Cada 3 horas recolecta titulares de los medios y actualiza el análisis en noticias/datos/.
name: Comparar titulares

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11
      - run: python noticias/recolectar.py
      - run: python noticias/analizar.py
      - name: Guardar
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add noticias/datos
          git commit -m "Titulares actualizados" || echo "Sin cambios"
          git pull --rebase -q || true
          git push
